name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as a draft (uncheck to release immediately)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Build signed release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Read the built version
        working-directory: app/build/outputs/apk/release
        run: |
          VERSION=$(jq -r '.elements[0].versionName' output-metadata.json)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read versionName from output-metadata.json"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Rename APKs
        working-directory: app/build/outputs/apk/release
        run: |
          mv app-universal-release.apk   "LADB_${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk   "LADB_${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "LADB_${VERSION}-armeabi-v7a.apk"
          mv app-x86-release.apk         "LADB_${VERSION}-x86.apk"
          mv app-x86_64-release.apk      "LADB_${VERSION}-x86_64.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "${{ env.VERSION }}"
          draft: ${{ inputs.draft }}
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/LADB_${{ env.VERSION }}-universal.apk
            app/build/outputs/apk/release/LADB_${{ env.VERSION }}-arm64-v8a.apk
            app/build/outputs/apk/release/LADB_${{ env.VERSION }}-armeabi-v7a.apk
            app/build/outputs/apk/release/LADB_${{ env.VERSION }}-x86.apk
            app/build/outputs/apk/release/LADB_${{ env.VERSION }}-x86_64.apk
